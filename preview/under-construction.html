<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Achint Satsangi</title>
  <meta name="theme-color" content="#FBFBFD" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0A0A0C" media="(prefers-color-scheme: dark)" />
  <style>
    :root { --paper: #FBFBFD; --ink: #0A0A0C; --muted: #6B6B70; }
    @media (prefers-color-scheme: dark) { :root { --paper: #0A0A0C; --ink: #FBFBFD; --muted: #9A9AA0; } }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; padding: 2rem; -webkit-font-smoothing: antialiased; }
    main { max-width: 34rem; }
    .eyebrow { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.5rem; }
    h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; margin-bottom: 1.75rem; }
    p { font-size: 1.125rem; line-height: 1.6; color: var(--muted); margin-bottom: 1rem; }
    a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
    .sign { margin-top: 2.5rem; font-size: 0.9rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Oslo, Norway</p>
    <h1>Achint Satsangi.</h1>
    <p>This site is under construction — being built the way I ship code, delete-first, so it's taking a minute.</p>
    <p>Back soon. If you need me before then, I'm at <a href="mailto:achint.satsangi@gmail.com">achint.satsangi@gmail.com</a>.</p>
    <p class="sign">— A.</p>
  </main>
</body>
</html>
